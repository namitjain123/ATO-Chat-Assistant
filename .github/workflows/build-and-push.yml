name: Build and push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No secrets needed here — verified directly that every module the
      # test suite imports (app.gateway.client, crawl, evals.pipeline,
      # app.ingestion.chunking.splitter) loads cleanly with
      # zero API keys set. Tests mock any external client calls rather than
      # hitting real APIs.
      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-backend:v1

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-ui:v1

      # Pushing to ACR alone does NOT redeploy the running Container Apps —
      # they only pick up a new image when explicitly told to via an update
      # call. Without this, the live app can silently keep running an old
      # image indefinitely even after every push "succeeds."
      #
      # --revision-suffix is required here, not optional: the image tag is
      # static (:v1), and verified directly that `containerapp update
      # --image <same tag string>` is treated as a no-op when the tag string
      # hasn't changed — it does NOT re-resolve the tag to the newly-pushed
      # digest, and creates no new revision, even though the run reports
      # "succeeded." Giving each deploy a unique suffix (the run number)
      # forces Azure to actually create a fresh revision and pull the image
      # again every time.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ragchatbot \
              --resource-group todoapp-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-backend:v1 \
              --revision-suffix run${{ github.run_number }}

      - name: Deploy UI to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ragchatbot-ui \
              --resource-group todoapp-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-ui:v1 \
              --revision-suffix run${{ github.run_number }}
