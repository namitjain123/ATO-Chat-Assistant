name: Build and push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-backend:v1

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-ui:v1

      # Pushing to ACR alone does NOT redeploy the running Container Apps —
      # they only pick up a new image when explicitly told to via an update
      # call. Without this, the live app can silently keep running an old
      # image indefinitely even after every push "succeeds." The image tag
      # here is static (:v1), so `containerapp update` is what actually
      # forces a new revision — it always creates one when called, even if
      # the tag string is unchanged, because it re-resolves the tag to
      # whatever digest was just pushed.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ragchatbot \
              --resource-group todoapp-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-backend:v1

      - name: Deploy UI to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ragchatbot-ui \
              --resource-group todoapp-rg \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/chatbot-ui:v1
